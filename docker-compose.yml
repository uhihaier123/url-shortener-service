version: '3.8'

services:
  # .NET Core API backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url-shortener-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - mynetwork

  # Vue frontend
  ui:
    build:
      context: ./url-shortener-ui
      dockerfile: Dockerfile
    container_name: url-shortener-ui
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    networks:
      - mynetwork
    depends_on:
      - api

networks:
  mynetwork:
    driver: bridge